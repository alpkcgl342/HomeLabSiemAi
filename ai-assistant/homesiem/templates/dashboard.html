<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLabSiemAi · Panel</title>
<style>
/* Tokens: reference data-viz palette (light/dark selected, not flipped) */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --seq: #2a78d6; --seq-soft: #86b6ef;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #898781;
  --good-text: #006300;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --seq: #3987e5; --seq-soft: #1c5cab;
    --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --seq: #3987e5; --seq-soft: #1c5cab;
  --good-text: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }

/* Top bar */
header.top { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--ring); }
header.top .wrap { display: flex; align-items: center; gap: 14px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; margin-right: auto; }
.brand svg { flex: none; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
        background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); }
.seg { display: inline-flex; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--ring); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.btn { border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600;
       background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); }
.btn.primary { background: var(--s1); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .55; cursor: progress; }
.btn:focus-visible, .seg button:focus-visible, .chip:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

.banner { display: none; margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--surface);
          box-shadow: inset 0 0 0 1px var(--ring); align-items: center; gap: 10px; }
.banner.show { display: flex; }
.banner.err { box-shadow: inset 3px 0 0 var(--critical), inset 0 0 0 1px var(--ring); }
.spin { width: 14px; height: 14px; border: 2px solid var(--grid); border-top-color: var(--s1); border-radius: 50%; animation: s 0.8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }

/* Grid of cards */
.grid { display: grid; gap: 16px; margin-top: 16px; }
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.row-2-1 { grid-template-columns: 2fr 1fr; }
.row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .row-2-1, .row-3 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.card { background: var(--surface); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--ring); padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.card .sub { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
.kpi .label { color: var(--ink-2); font-size: 12px; }
.kpi .value { font-size: 28px; font-weight: 650; margin-top: 4px; letter-spacing: -0.01em; }
.kpi .value.alert { display: flex; align-items: center; gap: 8px; }

/* Summary */
.summary p { margin: 0 0 8px; }
.summary ul { margin: 6px 0 0; padding-left: 18px; }
.summary li { margin: 4px 0; }
.meta { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font); }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.swatch.line { height: 2px; border-radius: 1px; width: 14px; }
.tooltip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink);
           box-shadow: 0 4px 16px rgba(0,0,0,.18), inset 0 0 0 1px var(--ring); border-radius: 8px;
           padding: 8px 10px; font-size: 12px; max-width: 320px; display: none; }
.tooltip b { font-weight: 650; }
.tooltip .tt-row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.barlist { display: grid; gap: 7px; }
.barrow { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
.barrow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.barrow .track { height: 14px; position: relative; }
.barrow .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.barrow .val { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.barrow:hover .name { color: var(--ink); }

/* Severity badge: icon + label, never color alone */
.sev { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px;
       font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
.sev svg { flex: none; }
.sev.critical { background: var(--critical); } .sev.high { background: var(--serious); color: #0b0b0b; }
.sev.medium { background: var(--warning); color: #0b0b0b; } .sev.low, .sev.info { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ring); }
.risk { display: inline-flex; align-items: baseline; gap: 1px; font-weight: 650; font-variant-numeric: tabular-nums; }
.risk small { color: var(--muted); font-weight: 400; }

/* Findings table */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.chip { border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px;
        background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-2); font-weight: 600; }
.filters input, .filters select { border-radius: 8px; border: 0; box-shadow: inset 0 0 0 1px var(--ring); background: var(--surface); padding: 5px 10px; font-size: 12px; }
.filters input { min-width: 220px; flex: 1; max-width: 360px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
tr.frow { cursor: pointer; }
tr.frow:hover td { background: var(--surface-2); }
tr.detail td { background: var(--surface-2); padding: 12px 16px 16px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.detail h4 { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.detail p { margin: 0 0 10px; }
pre { margin: 0; font: 12px/1.4 var(--mono); background: var(--surface); border-radius: 8px; padding: 10px;
      box-shadow: inset 0 0 0 1px var(--ring); overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-word; }
.mitre a { color: var(--s1); text-decoration: none; font-size: 12px; margin-right: 6px; white-space: nowrap; }
.mitre a:hover { text-decoration: underline; }
.src { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.empty { text-align: center; padding: 60px 20px; }
.empty h2 { font-size: 18px; margin-bottom: 6px; }
.empty p { color: var(--ink-2); margin: 0 0 16px; }

/* Ask */
.ask textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 8px; border: 0; padding: 10px;
                background: var(--page); box-shadow: inset 0 0 0 1px var(--ring); }
.ask .bar { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.ask .examples { display: flex; gap: 6px; flex-wrap: wrap; }
.answer { margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--page); box-shadow: inset 0 0 0 1px var(--ring); display: none; }
.answer.show { display: block; }
.answer p { margin: 0 0 8px; } .answer ul { margin: 0 0 8px; padding-left: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
footer { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2 4 5.5v6.2c0 5.4 3.7 10.3 9 12.3 5.3-2 9-6.9 9-12.3V5.5L13 2Z" fill="var(--s1)"/><path d="M8.5 13.2h2.6l1.6-3.6 2.2 7 1.6-3.4h1.9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>HomeLabSiemAi <small data-i18n="subtitle"></small></span>
    </div>
    <span class="pill" id="llmPill"><span class="dot" id="llmDot"></span><span id="llmText">…</span></span>
    <span class="pill" id="srcPill"></span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-theme-btn="light" title="Light">☀</button><button type="button" data-theme-btn="dark" title="Dark">☾</button>
    </div>
    <button class="btn" id="btnDemo" type="button" data-i18n="demo"></button>
    <button class="btn primary" id="btnRun" type="button" data-i18n="run"></button>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" role="status" aria-live="polite"><span class="spin" id="bannerSpin"></span><span id="bannerText"></span></div>

  <section id="emptyState" class="card empty" hidden>
    <h2 data-i18n="emptyTitle"></h2>
    <p data-i18n="emptyText"></p>
    <button class="btn primary" type="button" id="btnEmptyDemo" data-i18n="demo"></button>
  </section>

  <div id="content" hidden>
    <section class="grid kpis" id="kpis"></section>

    <section class="grid row-2-1">
      <article class="card summary">
        <h2 data-i18n="summary"></h2>
        <p class="sub" id="summaryMeta"></p>
        <div id="summary"></div>
      </article>
      <article class="card">
        <h2 data-i18n="bySeverity"></h2>
        <p class="sub" data-i18n="bySeveritySub"></p>
        <div class="barlist" id="sevBars"></div>
      </article>
    </section>

    <section class="grid">
      <article class="card">
        <h2 data-i18n="timeline"></h2>
        <p class="sub" data-i18n="timelineSub"></p>
        <div class="legend" id="tlLegend"></div>
        <div class="chart" id="timeline"></div>
      </article>
    </section>

    <section class="grid row-3">
      <article class="card">
        <h2 data-i18n="hostRisk"></h2>
        <p class="sub" data-i18n="hostRiskSub"></p>
        <div class="barlist" id="hostRisk"></div>
      </article>
      <article class="card">
        <h2 data-i18n="talkers"></h2>
        <p class="sub" data-i18n="talkersSub"></p>
        <div class="barlist" id="talkers"></div>
      </article>
      <article class="card">
        <h2 data-i18n="mitre"></h2>
        <p class="sub" data-i18n="mitreSub"></p>
        <div class="barlist" id="mitreBars"></div>
      </article>
    </section>

    <section class="grid">
      <article class="card">
        <h2 data-i18n="findings"></h2>
        <p class="sub" data-i18n="findingsSub"></p>
        <div class="filters" id="filters">
          <span id="sevChips"></span>
          <select id="srcFilter" aria-label="source"></select>
          <input id="search" type="search" autocomplete="off">
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th class="sortable" data-sort="ai_risk" data-i18n="risk"></th>
              <th data-i18n="severity"></th>
              <th data-i18n="finding"></th>
              <th data-i18n="host"></th>
              <th data-i18n="source"></th>
              <th>MITRE</th>
              <th class="sortable" data-sort="count" style="text-align:right" data-i18n="count"></th>
              <th class="sortable" data-sort="last_seen" data-i18n="lastSeen"></th>
            </tr></thead>
            <tbody id="ftable"></tbody>
          </table>
        </div>
      </article>
    </section>

    <section class="grid row-2-1">
      <article class="card ask">
        <h2 data-i18n="ask"></h2>
        <p class="sub" data-i18n="askSub"></p>
        <label class="sr" for="question" data-i18n="ask"></label>
        <textarea id="question" maxlength="500"></textarea>
        <div class="bar">
          <button class="btn primary" type="button" id="btnAsk" data-i18n="askBtn"></button>
          <div class="examples" id="examples"></div>
        </div>
        <div class="answer" id="answer" aria-live="polite"></div>
      </article>
      <article class="card">
        <h2 data-i18n="domains"></h2>
        <p class="sub" data-i18n="domainsSub"></p>
        <div class="barlist" id="domains"></div>
        <div id="historyWrap" hidden>
          <h2 style="margin-top:18px" data-i18n="history"></h2>
          <p class="sub" data-i18n="historySub"></p>
          <div class="chart" id="history"></div>
        </div>
      </article>
    </section>
  </div>
  <footer><span data-i18n="footer"></span> · <span id="ver"></span></footer>
</main>
<div class="tooltip" id="tt" role="tooltip"></div>

<script>
"use strict";
// ---------------------------------------------------------------- i18n
const I18N = {

const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } } };
let lang = store.get("hs-lang", null);
const T = (k) => (I18N[lang] || I18N.en)[k] ?? k;

// ---------------------------------------------------------------- tiny DOM helpers (textContent only => no XSS)
const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "style") e.style.cssText = v;

// ---------------------------------------------------------------- API

}

  if (!lang) lang = STATUS.language || "tr";

  polling = false; [DATA, HIST] = await Promise.all([api("/api/latest"), api("/api/history")]); render();

  const box = $("answer"); box.className = "answer show"; box.replaceChildren(h("span", { class: "sub", text: T("asking") }));
  $("btnAsk").disabled = true;
  try { const r = await api("/api/ask", { question: q, language: lang });
    box.replaceChildren(r.online ? md(r.answer) : h("p", { text: T("llmNotOnline") }), h("div", { class: "meta", text: `${T("model")}: ${r.model}` })); }
  catch (e) { box.replaceChildren(h("p", { text: String(e.message || e) })); }
  finally { $("btnAsk").disabled = false; }
}

// ---------------------------------------------------------------- events
$("btnRun").addEventListener("click", () => run("analyze"));
$("btnDemo").addEventListener("click", () => run("demo"));
$("btnEmptyDemo").addEventListener("click", () => run("demo"));
$("btnAsk").addEventListener("click", ask);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });
$("search").addEventListener("input", (e) => { UI.q = e.target.value; renderTable(); });
$("srcFilter").addEventListener("change", (e) => { UI.src = e.target.value; renderTable(); });
document.querySelectorAll("th.sortable").forEach((th) => th.addEventListener("click", () => { if (UI.sort === th.dataset.sort) UI.dir *= -1; else { UI.sort = th.dataset.sort; UI.dir = -1; } renderTable(); }));
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("hs-lang", lang); applyI18n(); renderStatus(); render(); }));
function setTheme(t) { document.documentElement.dataset.theme = t; store.set("hs-theme", t);
  document.querySelectorAll("[data-theme-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === t))); if (DATA) render(); }
document.querySelectorAll("[data-theme-btn]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeBtn)));
setTheme(store.get("hs-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => DATA && render(), 150); });
loadAll().catch((e) => { $("banner").className = "banner show err"; $("bannerSpin").hidden = true; $("bannerText").textContent = String(e); });
</script>
</body>
</html>
