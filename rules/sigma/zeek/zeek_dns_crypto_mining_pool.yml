title: DNS Lookup of Cryptocurrency Mining Pool
id: 7e2c87ec-7c17-4724-9ec0-0595cd81ed0b
status: experimental
description: A device resolved a well-known mining pool - possible cryptojacking of a PC, NAS or IoT device.
references:
  - https://attack.mitre.org/techniques/T1496/
author: homenet-siem-ai
date: 2026-11-21
tags:
  - attack.impact
  - attack.t1496
logsource:
  product: zeek
  service: dns
detection:
  selection:
    query|contains:
      - 'nanopool.org'
      - 'supportxmr.com'
      - '2miners.com'
      - 'minexmr.com'
      - 'f2pool.com'
      - 'moneroocean.stream'
      - 'herominers.com'
  condition: selection
falsepositives:
  - Intentional mining by the owner
level: high
